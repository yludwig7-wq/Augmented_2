    <style>
        :root {
            /* Original dimensions of each PNG layer */
            --scene-width: 7568px;
            --scene-height: 768px;

            /* Height of the visible parallax window */
            --viewer-height: min(100vh, 900px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #111;
        }

        /*
      This is the element the user scrolls horizontally.
    */
        .parallax-scroller {
            position: relative;
            width: 100%;
            height: var(--viewer-height);

            overflow-x: auto;
            overflow-y: hidden;

            scroll-behavior: smooth;
            overscroll-behavior-x: contain;
            scrollbar-gutter: stable;

            /*
        Enables horizontal scrolling with touch gestures.
      */
            touch-action: pan-x;
        }

        /*
      This element creates the 18,920px-wide scrollable area.
    */
        .parallax-track {
            position: relative;
            width: var(--scene-width);
            height: 100%;
        }

        /*
      The stage remains attached to the left side of the scroll container.
      JavaScript moves each layer at a different speed.
    */
        .parallax-stage {
            position: sticky;
            left: 0;
            top: 0;

            width: 100vw;
            height: 100%;

            overflow: hidden;
            pointer-events: none;
        }

        .parallax-layer {
            position: absolute;
            top: 50%;
            left: 0;

            width: var(--scene-width);
            height: var(--scene-height);

            object-fit: fill;
            max-width: none;

            /*
        Keeps the 1980px-high artwork vertically centered.
        JavaScript adds translateX().
      */
            transform: translate3d(0, -50%, 0);

            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
        }

        /*
      Layer order:
      layer-back is farthest away.
      layer-front is closest to the viewer.
    */
        .layer-back {
            z-index: 1;
        }

        .layer-middle-back {
            z-index: 2;
        }

        .layer-middle-front {
            z-index: 3;
        }

        .layer-front {
            z-index: 4;
        }

        /*
      Optional scrollbar styling.
    */
        .parallax-scroller::-webkit-scrollbar {
            height: 12px;
        }

        .parallax-scroller::-webkit-scrollbar-track {
            background: #222;
        }

        .parallax-scroller::-webkit-scrollbar-thumb {
            background: #777;
            border: 3px solid #222;
            border-radius: 999px;
        }

        /*
      Optional instructions overlay.
      Remove this element and these styles when not needed.
    */
        .scroll-hint {
            position: absolute;
            z-index: 10;
            left: 20px;
            bottom: 24px;

            padding: 10px 14px;
            border-radius: 8px;

            color: white;
            background: rgb(0 0 0 / 55%);
            font-family: Arial, sans-serif;
            font-size: 14px;

            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .scroll-hint.is-hidden {
            opacity: 0;

    <script>
        (() => {
    const scroller = document.getElementById("parallaxScroller");
    const layers = [
    ...document.querySelectorAll(
        ".parallax-layer, .parallax-island, .island-button"
    )
];
    const scrollHint = document.getElementById("scrollHint");

    let animationFrameId = null;

    function renderParallax() {
        const scrollPosition = scroller.scrollLeft;

        layers.forEach((layer) => {
            const speed = Number(layer.dataset.speed) || 1;
            const horizontalMovement = scrollPosition * speed;

            const isIsland = layer.classList.contains("parallax-island");
const isButton = layer.classList.contains("island-button");

let baseTransform;

if (isIsland) {
    baseTransform = `translate(calc(-50% - ${horizontalMovement}px), -50%)`;
} else if (isButton) {
    baseTransform = `translate(calc(-50% - ${horizontalMovement}px), 0)`;
} else {
    baseTransform = `translate3d(${-horizontalMovement}px, -50%, 0)`;
}

            layer.style.transform = baseTransform;
        });

        if (scrollPosition > 30) {
            scrollHint?.classList.add("is-hidden");
        } else {
            scrollHint?.classList.remove("is-hidden");
        }

        animationFrameId = null;
    }

    function requestRender() {
        if (animationFrameId !== null) return;
        animationFrameId = requestAnimationFrame(renderParallax);
    }

    scroller.addEventListener("scroll", requestRender, { passive: true });
    window.addEventListener("resize", requestRender);

    scroller.addEventListener(
        "wheel",
        (event) => {
            const primarilyVertical = Math.abs(event.deltaY) > Math.abs(event.deltaX);
            if (!primarilyVertical) return;

            const maxScroll = scroller.scrollWidth - scroller.clientWidth;
            const movingForward = event.deltaY > 0 && scroller.scrollLeft < maxScroll;
            const movingBackward = event.deltaY < 0 && scroller.scrollLeft > 0;

            if (movingForward || movingBackward) {
                event.preventDefault();
                scroller.scrollLeft += event.deltaY;
            }
        },
        { passive: false }
    );

    renderParallax();
})();




(() => {
    const glossySound = new Audio("sounds/glossysound.wav");
    glossySound.preload = "auto";

    // Small cooldown so rapid drag movement doesn't spam-restart the sound
    const COOLDOWN_MS = 800;
    let lastPlayed = 0;

    function playGlossySound() {
        const now = Date.now();
        if (now - lastPlayed < COOLDOWN_MS) return;
        lastPlayed = now;

        // Restart from the beginning even if it's already playing
        glossySound.currentTime = 0;
        glossySound.play().catch(() => {
            // Autoplay-policy errors are safe to ignore here;
            // this only runs after a real user interaction anyway
        });
    }

    const islands = document.querySelectorAll(".parallax-island");

    islands.forEach((island) => {
        island.addEventListener("camera-change", (event) => {
            if (event.detail?.source === "user-interaction") {
                playGlossySound();
            }
        });
    });
})();
